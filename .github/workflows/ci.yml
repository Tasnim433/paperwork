name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Placeholders so env validation passes; CI never connects to a database or an AI provider.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-0000
      BETTER_AUTH_URL: http://localhost:3000
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # OCR language data used by the fixture letter tests (downloaded on first use).
      - uses: actions/cache@v4
        with:
          path: .data/tesseract
          key: tesseract-deu-eng-v1

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
